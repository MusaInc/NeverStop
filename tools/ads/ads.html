<!DOCTYPE html>
<!--
  City Swing billboard atlas: every in-world advert, laid out on one page and
  screenshotted by tools/ads/render.mjs into assets/ads/ads_atlas.png.
  Fictional brands only (the City Swing universe). Two formats per brand:
  wide 768x384 and tall 384x768, plus two 3072x96 tickers.
  ?mask renders the motion mask instead: white where the shader animates
  (.fx regions), black elsewhere - it becomes the atlas alpha channel.
  The layout (cell rects, fx kind + region, accent colour) is exported as
  window.ATLAS_META for assets/ads/ads_meta.json.
-->

<meta charset="utf-8">
<style>
@font-face { font-family: Outfit; font-weight: 900; src: url("../../assets/fonts/outfit_black.ttf"); }
@font-face { font-family: Outfit; font-weight: 700; src: url("../../assets/fonts/outfit_bold.ttf"); }
@font-face { font-family: Outfit; font-weight: 600; src: url("../../assets/fonts/outfit_semibold.ttf"); }
@font-face { font-family: Narrow; font-weight: 700; font-style: italic; src: url("/usr/share/fonts/opentype/urw-base35/NimbusSansNarrow-BoldOblique.otf"); }
@font-face { font-family: Narrow; font-weight: 700; src: url("/usr/share/fonts/opentype/urw-base35/NimbusSansNarrow-Bold.otf"); }
@font-face { font-family: Narrow; font-weight: 400; src: url("/usr/share/fonts/opentype/urw-base35/NimbusSansNarrow-Regular.otf"); }
@font-face { font-family: Geo; font-weight: 600; src: url("/usr/share/fonts/opentype/urw-base35/URWGothic-Demi.otf"); }
@font-face { font-family: Geo; font-weight: 400; src: url("/usr/share/fonts/opentype/urw-base35/URWGothic-Book.otf"); }
@font-face { font-family: Didone; font-weight: 400; src: url("/usr/share/fonts/opentype/urw-base35/C059-Roman.otf"); }
@font-face { font-family: Didone; font-weight: 400; font-style: italic; src: url("/usr/share/fonts/opentype/urw-base35/C059-Italic.otf"); }
@font-face { font-family: Didone; font-weight: 700; src: url("/usr/share/fonts/opentype/urw-base35/C059-Bold.otf"); }
@font-face { font-family: Pala; font-weight: 400; src: url("/usr/share/fonts/opentype/urw-base35/P052-Roman.otf"); }
@font-face { font-family: Pala; font-weight: 400; font-style: italic; src: url("/usr/share/fonts/opentype/urw-base35/P052-Italic.otf"); }
html, body { margin: 0; padding: 0; background: #000; }
body { width: 3072px; height: 2880px; position: relative; overflow: hidden; }
.cell { position: absolute; overflow: hidden; }
.cell * { position: absolute; box-sizing: border-box; }
.fx { display: none; }
body.mask .cell { background: #000 !important; }
body.mask .cell > *:not(.fx) { visibility: hidden; }
body.mask .fx { display: block; visibility: visible; background: #fff; }
.t { white-space: nowrap; line-height: 1; }
svg { overflow: visible; }
</style>
</head>

  meta.ads.push({id: b.id, accent: b.accent, fx: b.fx, wide: [...w, ...WIDE], tall: [...t, ...TALL]});

  <div class="t" id="tk_market" style="left:0;top:28px;font:700 40px Narrow;letter-spacing:1px">${mk}</div>

  <div class="t" id="tk_news" style="left:0;top:28px;font:700 40px Outfit;color:#ffe3b0;letter-spacing:2px">${nw}</div>

// The scroll period is the strip's own width (it must fit in 3072).
const per = id => Math.ceil(document.getElementById(id).scrollWidth);
meta.tickers.push({id: "market", rect: [0, 2688, 3072, 96], period: per("tk_market")}, {id: "news", rect: [0, 2784, 3072, 96], period: per("tk_news")});
if (location.search.includes("mask")) document.body.classList.add("mask");
// fx rects (cell-relative, 0..1) from the .fx elements.
for (const ad of meta.ads) {
  for (const fmt of ["wide", "tall"]) {
    const cell = document.getElementById(`${ad.id}_${fmt}`);
    const fx = cell.querySelector(".fx");
    if (!fx) { ad[fmt + "_fx"] = [0, 0, 0, 0]; continue; }
    const cr = cell.getBoundingClientRect();
    fx.style.display = "block";
    const r = fx.getBoundingClientRect();
    if (!document.body.classList.contains("mask")) fx.style.display = "";
    ad[fmt + "_fx"] = [(r.left - cr.left) / cr.width, (r.top - cr.top) / cr.height, r.width / cr.width, r.height / cr.height];
  }
}
